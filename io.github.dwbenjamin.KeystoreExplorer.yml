app-id: io.github.dwbenjamin.KeystoreExplorer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: keystore-explorer
finish-args:
  - --share=ipc
  - --share=network
  - --filesystem=home
  - --socket=x11
  - --socket=wayland
modules:
  - name: keystore-explorer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk21/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk21
    build-commands:
      - install -d /app/lib/keystore-explorer /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/metainfo /app/share/licenses/${FLATPAK_ID}
      - unzip -q kse-570.zip -d /app/lib/keystore-explorer
      - /usr/lib/sdk/openjdk21/bin/jlink --module-path /usr/lib/sdk/openjdk21/jmods --add-modules java.se,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.security.auth,jdk.localedata,jdk.zipfs,jdk.unsupported --strip-debug --no-header-files --no-man-pages --output /app/lib/keystore-explorer/kse-570/jre
      - install -Dm755 packaging/keystore-explorer.sh /app/bin/keystore-explorer
      - install -Dm644 io.github.dwbenjamin.KeystoreExplorer.desktop /app/share/applications/io.github.dwbenjamin.KeystoreExplorer.desktop
      - install -Dm644 /app/lib/keystore-explorer/kse-570/icons/kse_256.png /app/share/icons/hicolor/256x256/apps/io.github.dwbenjamin.KeystoreExplorer.png
      - install -Dm644 io.github.dwbenjamin.KeystoreExplorer.metainfo.xml /app/share/metainfo/io.github.dwbenjamin.KeystoreExplorer.metainfo.xml
      - cp -a /app/lib/keystore-explorer/kse-570/licenses/. /app/share/licenses/${FLATPAK_ID}/
    sources:
      - type: file
        url: https://github.com/kaikramer/keystore-explorer/releases/download/v5.7.0/kse-570.zip
        sha256: 023ba49044f49dea00e9ef62eef0bdcdba532a61045d96a5fb1d855e04acf6b6
        dest-filename: kse-570.zip
      - type: dir
        path: .